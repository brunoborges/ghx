name: golangci-lint

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit SHA or ref to lint
        type: string
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
