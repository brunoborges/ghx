<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">ghx — GitHub CLI Cache Proxy</title>
  <desc id="description">Stop hitting GitHub rate limits. A caching proxy built for AI agent workflows.</desc>
  <!-- Editable source. Regenerate the social image with: rsvg-convert docs/og-image.svg -o docs/og-image.png -->
  <rect width="1200" height="630" fill="#0d1117"/>
  <path d="M0 0H1200" stroke="#58a6ff" stroke-width="12"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <path d="M92 64L66 108H88L80 136L118 90H96L108 64Z" fill="#d29922"/>
    <text x="132" y="119" fill="#58a6ff" font-size="64" font-weight="700">ghx</text>
    <text x="66" y="218" fill="#e6edf3" font-size="24">GitHub CLI Cache Proxy</text>
    <g font-size="58" font-weight="700" letter-spacing="-1.5">
      <text x="66" y="310" fill="#e6edf3">Stop hitting</text>
      <text x="66" y="380" fill="#58a6ff">GitHub rate limits.</text>
    </g>
    <text x="66" y="444" fill="#b1bac4" font-size="24">Built for AI agent workflows.</text>
    <path d="M66 509H1134" stroke="#30363d"/>
    <text x="66" y="563" fill="#b1bac4" font-size="21">Cache responses. Coalesce requests.</text>
    <text x="1134" y="563" text-anchor="end" fill="#58a6ff" font-size="21">brunoborges.github.io/ghx</text>
  </g>
  <g transform="translate(705 174)">
    <rect width="429" height="281" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <path d="M0 48H429" stroke="#30363d"/>
    <g fill="#8b949e">
      <circle cx="24" cy="24" r="5"/>
      <circle cx="44" cy="24" r="5"/>
      <circle cx="64" cy="24" r="5"/>
    </g>
    <g font-family="Menlo, monospace" font-size="23">
      <text x="28" y="102" fill="#e6edf3"><tspan fill="#3fb950">$</tspan> ghx pr list</text>
      <text x="28" y="147" fill="#b1bac4">Cache. Coalesce. Reuse.</text>
      <path d="M28 178H401" stroke="#30363d"/>
